kind = "web"
previewPath = "/"
title = "Sellify"
version = "1.0.0"
id = "artifacts/sellify"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21379

[services.development]
run = "pnpm --filter @workspace/sellify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sellify", "run", "build" ]
serve = "static"
publicDir = "artifacts/sellify/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21379"
BASE_PATH = "/"
