openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sellify API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: listings
    description: Marketplace listings
  - name: ai
    description: AI listing generation
  - name: categories
    description: Categories
  - name: me
    description: Current user
  - name: messages
    description: Conversations and messages
  - name: sellers
    description: Public seller profiles
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories with active listing counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: Search and browse active listings
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: city
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: condition
          in: query
          schema: { type: string }
        - name: sellerId
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc] }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Listing search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingSearchResult"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a listing draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /listings/slug/{slug}:
    get:
      operationId: getListingBySlug
      tags: [listings]
      summary: Get a public listing by slug (no auth, increments view count)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /listings/{id}/publish:
    post:
      operationId: publishListing
      tags: [listings]
      summary: Publish a draft listing (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Published listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{id}/sold:
    post:
      operationId: markListingSold
      tags: [listings]
      summary: Mark a listing as sold (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sold listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{id}/favorite:
    post:
      operationId: toggleFavorite
      tags: [listings]
      summary: Toggle favorite on a listing (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteState"
  /listings/{id}/similar:
    get:
      operationId: getSimilarListings
      tags: [listings]
      summary: Similar active listings (same category, nearby)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Similar listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
  /listings/{id}/stats:
    get:
      operationId: getListingStats
      tags: [listings]
      summary: Seller stats for a listing (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingStats"
  /ai/analyze:
    post:
      operationId: analyzeImages
      tags: [ai]
      summary: AI-analyze product images and generate a listing draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAnalyzeInput"
      responses:
        "200":
          description: AI-generated listing draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiListingDraft"
  /ai/refine:
    post:
      operationId: refineListingDraft
      tags: [ai]
      summary: Quickly rewrite an existing draft's text using extra seller notes (no image analysis)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiRefineInput"
      responses:
        "200":
          description: Refined text fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRefineResult"
  /ai/transcribe:
    post:
      operationId: transcribeAudio
      tags: [ai]
      summary: Transcribe a short audio recording to text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTranscribeInput"
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTranscribeResult"
  /home:
    get:
      operationId: getHomeFeed
      tags: [listings]
      summary: Home feed with recommended, newest and nearby listings
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Home feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeFeed"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user's profile (creates one on first call)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /me/listings:
    get:
      operationId: getMyListings
      tags: [me]
      summary: Current user's listings (all statuses)
      responses:
        "200":
          description: My listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
  /me/favorites:
    get:
      operationId: getMyFavorites
      tags: [me]
      summary: Current user's favorited listings
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
  /me/push-token:
    post:
      operationId: savePushToken
      tags: [me]
      summary: Register a device push token for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "204":
          description: Saved
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /sellers/{id}:
    get:
      operationId: getSeller
      tags: [sellers]
      summary: Public seller profile with active listings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerPublic"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List current user's conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start (or reuse) a conversation about a listing and send first message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get messages in a conversation (marks as read)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Category:
      type: object
      required: [id, slug, nameSv, nameEn, icon, listingCount]
      properties:
        id: { type: integer }
        slug: { type: string }
        nameSv: { type: string }
        nameEn: { type: string }
        icon: { type: string, description: "Lucide icon name" }
        listingCount: { type: integer }
    Listing:
      type: object
      required:
        [
          id,
          sellerId,
          title,
          description,
          status,
          price,
          currency,
          condition,
          images,
          city,
          country,
          slug,
          shipping,
          viewCount,
          favoriteCount,
          isFavorited,
          createdAt,
        ]
      properties:
        id: { type: integer }
        sellerId: { type: string }
        sellerName: { type: ["string", "null"] }
        sellerAvatarUrl: { type: ["string", "null"] }
        title: { type: string }
        description: { type: string }
        shortDescription: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        categoryNameSv: { type: ["string", "null"] }
        categoryNameEn: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        material: { type: ["string", "null"] }
        condition:
          type: string
          enum: [new, like_new, good, fair, worn]
        status:
          type: string
          enum: [draft, active, sold]
        price: { type: number }
        currency: { type: string }
        priceType:
          type: ["string", "null"]
          enum: [fixed, negotiable, null]
        city: { type: string }
        region: { type: ["string", "null"] }
        country: { type: string }
        postalCode: { type: ["string", "null"] }
        shipping:
          type: string
          enum: [pickup, ship, both]
        images:
          type: array
          items: { type: string }
          description: Ordered image URLs; first is the main image.
        slug: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        keywords:
          type: ["array", "null"]
          items: { type: string }
        specifications:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/Specification"
        viewCount: { type: integer }
        favoriteCount: { type: integer }
        isFavorited: { type: boolean }
        createdAt: { type: string }
        publishedAt: { type: ["string", "null"] }
        soldAt: { type: ["string", "null"] }
    Specification:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    ListingInput:
      type: object
      required: [title, description, price, currency, condition, images, city, country, shipping]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        shortDescription: { type: string }
        categoryId: { type: ["integer", "null"] }
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        material: { type: ["string", "null"] }
        condition: { type: string, enum: [new, like_new, good, fair, worn] }
        price: { type: number }
        currency: { type: string }
        priceType: { type: string, enum: [fixed, negotiable] }
        city: { type: string }
        region: { type: ["string", "null"] }
        country: { type: string }
        postalCode: { type: ["string", "null"] }
        shipping: { type: string, enum: [pickup, ship, both] }
        images:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        keywords:
          type: array
          items: { type: string }
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/Specification"
        status: { type: string, enum: [draft, active] }
    ListingUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        shortDescription: { type: string }
        categoryId: { type: ["integer", "null"] }
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        material: { type: ["string", "null"] }
        condition: { type: string, enum: [new, like_new, good, fair, worn] }
        price: { type: number }
        currency: { type: string }
        priceType: { type: string, enum: [fixed, negotiable] }
        city: { type: string }
        region: { type: ["string", "null"] }
        country: { type: string }
        postalCode: { type: ["string", "null"] }
        shipping: { type: string, enum: [pickup, ship, both] }
        images:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        keywords:
          type: array
          items: { type: string }
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/Specification"
    ListingSearchResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total: { type: integer }
    FavoriteState:
      type: object
      required: [favorited, favoriteCount]
      properties:
        favorited: { type: boolean }
        favoriteCount: { type: integer }
    ListingStats:
      type: object
      required: [viewCount, favoriteCount, messageCount, daysSincePublished, suggestions]
      properties:
        viewCount: { type: integer }
        favoriteCount: { type: integer }
        messageCount: { type: integer }
        daysSincePublished: { type: integer }
        suggestions:
          type: array
          items: { type: string }
          description: Simple AI-style suggestions based on the stats.
    AiAnalyzeInput:
      type: object
      required: [images, locale]
      properties:
        images:
          type: array
          minItems: 1
          items: { type: string }
          description: Object paths or URLs of uploaded product images.
        locale:
          type: string
          description: BCP-47 locale for generated text, e.g. sv or en.
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        userNotes:
          type: ["string", "null"]
          description: Extra details from the seller (spoken or typed) to incorporate in the listing.
    AiRefineInput:
      type: object
      required: [title, description, userNotes, locale]
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        locale:
          type: string
          description: BCP-47 locale for generated text, e.g. sv or en.
        userNotes:
          type: string
          description: Extra details from the seller (spoken or typed) to work into the text.
    AiRefineResult:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
        suggestedPrice: { type: ["number", "null"] }
        questions:
          type: array
          items: { type: string }
          description: Remaining follow-up questions, if any.
    AiTranscribeInput:
      type: object
      required: [audioBase64]
      properties:
        audioBase64:
          type: string
          description: Base64-encoded audio recording.
        mimeType: { type: ["string", "null"] }
    AiTranscribeResult:
      type: object
      required: [text]
      properties:
        text: { type: string }
    AiListingDraft:
      type: object
      required: [title, description, shortDescription, condition, suggestedPrice, currency, keywords]
      properties:
        title: { type: string }
        description: { type: string }
        shortDescription: { type: string }
        categoryId: { type: ["integer", "null"] }
        categorySlug: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        material: { type: ["string", "null"] }
        condition: { type: string, enum: [new, like_new, good, fair, worn] }
        suggestedPrice: { type: number }
        priceRangeLow: { type: ["number", "null"] }
        priceRangeHigh: { type: ["number", "null"] }
        currency: { type: string }
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/Specification"
        keywords:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        uncertainFields:
          type: array
          items: { type: string }
          description: Field names the AI is unsure about; UI should mark them as suggestions.
        questions:
          type: array
          items: { type: string }
          description: Short follow-up questions to the seller that would improve the listing.
    Profile:
      type: object
      required: [id, displayName, memberSince]
      properties:
        id: { type: string }
        displayName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        memberSince: { type: string }
        activeListingCount: { type: integer }
        soldListingCount: { type: integer }
    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        avatarUrl: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
    SellerPublic:
      type: object
      required: [id, displayName, memberSince, activeListingCount, soldListingCount, listings]
      properties:
        id: { type: string }
        displayName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        memberSince: { type: string }
        activeListingCount: { type: integer }
        soldListingCount: { type: integer }
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
    HomeFeed:
      type: object
      required: [newest, nearby, categories, totalActive]
      properties:
        newest:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        nearby:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        totalActive: { type: integer }
    Conversation:
      type: object
      required: [id, listingId, buyerId, sellerId, lastMessageAt, unreadCount]
      properties:
        id: { type: integer }
